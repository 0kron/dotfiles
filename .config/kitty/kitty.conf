#----------------------------------------------------#
#                  KITTY DE OKRON                    #
#----------------------------------------------------#

# Settings and Options
enable_audio_bell no
resize_in_steps yes
remember_window_size no
initial_window_width 82c
initial_window_height 24c
placement_strategy center
disable_ligatures always

# cursor settings
cursor_trail 0
cursor_trail_start_threshold 1
cursor_shape block
cursor_blink_interval 0
cursor_shape_unfocused hollow
shell_integration no-cursor

# DISABLE CONFIRMATION
confirm_os_window_close 0

# FONT FAMILY
font_family     Cousine Nerd Font
font_size 12

background_opacity 1
window_padding_width 5
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0

# ~/.config/themes/warm-dark/colors-kitty.conf
# Warm Dark - inspired by Everforest
# #EBDBB2

foreground            #d3c6aa
background            #171715
selection_foreground  #171715
selection_background  #d3c6aa

cursor                #d3c6aa
cursor_text_color     #171715

url_color             #7fbbb3

# black
color0                #343f44
color8                #475258

# red
color1                #e67e80
color9                #e67e80

# green
color2                #a7c080
color10               #a7c080

# yellow
color3                #dbbc7f
color11               #dbbc7f

# blue
color4                #7fbbb3
color12               #7fbbb3

# magenta
color5                #d699b6
color13               #d699b6

# cyan
